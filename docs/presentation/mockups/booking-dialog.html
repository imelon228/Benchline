<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking dialog | Benchline mockups</title>
  <link rel="stylesheet" href="../../../src/Benchline.Client/wwwroot/styles.css">
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
<header class="site-header"><div class="wrap header-content">
  <a href="workflows.html" class="brand">Benchline</a>
  <button type="button" class="quiet-button" data-theme-toggle>Dark mode</button>
</div></header>
<main class="wrap section">
<dialog id="reserve-dialog" aria-labelledby="reserve-title" open="" class="mockup-dialog"><div class="dialog-head"><h2 id="reserve-title">Reserve Desktop CNC</h2><span class="icon-button">Close</span></div>
    <p class="muted">Choose a start time and the latest finish you can accept if your session moves.</p>
    <div class="mockup-form"><label for="session-slot">Session start · Astana time (UTC+5)</label>
        <span class="mockup-value">Mon 16 Nov, 06:00 UTC+5</span>
        <label for="deadline-extra">If moved, finish by · UTC+5</label>
        <span class="mockup-value">Mon 16 Nov, 08:00 · 1 hour later</span><span class="primary-button">Confirm reservation</span></div></dialog>
</main>
<script src="theme.js"></script>
</body>
</html>
